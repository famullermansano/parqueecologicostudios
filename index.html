<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parque Ecológico Studios</title>
    <style>
        /* Reset de margens e aplicação da fonte padrão moderna do ecossistema */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #ffffff; /* Fundo branco nativo do app */
            color: #111827; /* Texto principal grafite escuro */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Seção do Topo (Mantido os 1.2 cm de altura solicitados) */
        #topo-menu {
            height: 1.2cm;
            background-color: #ffffff; /* Menu superior limpo integrado ao fundo */
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 10;
            border-bottom: 1px solid #e5e7eb; /* Divisor sutil em cinza claro */
        }

        /* Identidade Visual do Título/Logo */
        .logo h1 {
            font-size: 22px;
            color: #111827;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Menu de Navegação */
        .menu-links ul {
            display: flex;
            list-style: none;
            gap: 24px; /* Espaçamento ideal entre os links */
            align-items: center;
        }

        /* Estilização dos Links Padrão */
        .menu-links a {
            color: #374151; /* Cinza médio de alta legibilidade */
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            padding: 8px 12px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .menu-links a:hover {
            color: #1a56db; /* Transição para o azul característico do app */
            background-color: #f3f4f6; /* Feedback sutil de clique */
        }

        /* Destaque especial do botão de Reservas (Estilo Botão de Ação do App) */
        .menu-links .btn-reserva a {
            background-color: #1a56db; /* Azul oficial de conversão */
            color: #ffffff;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 8px; /* Cantos arredondados modernos */
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .menu-links .btn-reserva a:hover {
            background-color: #1e429f;
            color: #ffffff;
        }

        /* Estilização específica do ícone do WhatsApp */
        .btn-whatsapp a {
            display: flex;
            align-items: center;
            padding: 4px;
            border-radius: 50%;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .btn-whatsapp a:hover {
            background-color: transparent; /* Remove o fundo cinza padrão para o ícone */
            transform: scale(1.1); /* Dá um leve destaque ao passar o mouse */
            opacity: 0.9;
        }

        .btn-whatsapp svg {
            width: 32px; /* Tamanho proporcional para a barra de menu */
            height: 32px;
        }

        /* Área do Frame */
        #conteudo-principal {
            flex: 1;
            background-color: #ffffff;
        }

        .meu-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Topo / Menu com a identidade visual integrada -->
    <header id="topo-menu">
        <div class="logo">
            <h1></h1>
        </div>
        
        <nav class="menu-links">
            <ul>
                <li class="btn-reserva"><a href="https://nobeds.app/OnePage/1508199307" target="_blank">Reservas</a></li>
                <li><a href="#">Dicas</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="https://www.instagram.com/parqueecologicostudios/" target="_blank">Instagram</a></li>
                
                <!-- Botão de texto do WhatsApp substituído pelo logo em formato SVG oficial -->
                <li class="btn-whatsapp">
                    <a href="https://wa.me/5519989717974?text=Olá,%20Vim%20pelo%20site%20e%20gostaria%20de%20mais%20informações" target="_blank" title="Fale conosco no WhatsApp">
                        <svg viewBox="0 0 24 24" xmlns="http://w3.org">
                            <path fill="#25D366" d="M12.004 2C6.48 2 2 6.48 2 12c0 1.76.46 3.42 1.26 4.87L2 22l5.3-.13A9.94 9.94 0 0 0 12.004 22c5.52 0 10-4.48 10-10s-4.48-10-10-10z"/>
                            <path fill="#FFF" d="M17.472 14.382c-.3-.149-1.778-.878-2.034-.971-.256-.092-.443-.139-.63.14-.188.279-.724.91-.887 1.096-.164.186-.329.21-.629.06-.3-.15-1.265-.467-2.41-1.487-.893-.797-1.496-1.78-1.672-2.08-.176-.3-.019-.462.13-.61.135-.133.3-.349.45-.523.15-.174.2-.291.3-.487.1-.197.05-.369-.025-.518-.075-.149-.63-1.517-.862-2.074-.227-.547-.457-.473-.629-.482-.163-.008-.35-.01-.537-.01-.187 0-.49.07-.747.349-.256.28-1.026 1.002-1.026 2.445 0 1.442 1.049 2.836 1.196 3.03.147.195 2.062 3.148 4.996 4.414.697.301 1.242.481 1.668.617.7.223 1.338.192 1.843.117.563-.084 1.778-.726 2.034-1.393.256-.667.256-1.239.179-1.353-.076-.114-.277-.165-.578-.315z"/>
                        </svg>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <!-- Conteúdo Principal com o Frame -->
   <iframe id="nobeds-booking-frame" src="https://nobeds.app/DirectForm/Step/1508199307" style="width: 100%; border: none; min-height: 600px;" scrolling="no"></iframe>
<script>
window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'nobeds-resize') {
        document.getElementById('nobeds-booking-frame').style.height = e.data.height + 'px';
    }
}, false);
</script>
    
</body>
</html>
